<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>logain🥰❤️</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
}

h1{
color:#ff4d88;
margin:20px 0;
}

img{
width:90%;
max-width:400px;
height:500px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 15px rgba(255,255,255,.3);
}

button{
padding:12px 20px;
margin:15px 5px;
border:none;
border-radius:10px;
background:#ff4d88;
color:white;
font-size:18px;
cursor:pointer;
}

p{
font-size:20px;
padding:10px;
}

.heart{
position:fixed;
top:-20px;
font-size:25px;
animation:fall 6s linear infinite;
}

@keyframes fall{
from{transform:translateY(-20px);}
to{transform:translateY(100vh);}
}
</style>
</head>

<body>

<h1>logain🥰❤️</h1>

<audio controls autoplay loop>
<source src="باين حبيتك.mp3" type="audio/mpeg">
</audio>

<br><br>

<img id="photo" src="IMG-20260620-WA0300.jpg">

<p id="text">أجمل صورة وأجمل ذكرى ❤️</p>

<button onclick="prev()">السابق</button>
<button onclick="next()">التالي</button>

<script>

const images = [
"IMG-20260620-WA0300.jpg",
"IMG-20260620-WA0301.jpg",
"IMG-20260620-WA0302.jpg",
"IMG-20260620-WA0303.jpg",
"IMG-20260620-WA0304.jpg",
"IMG-20260620-WA0305.jpg",
"IMG-20260620-WA0306.jpg",
"IMG-20260620-WA0307.jpg",
"IMG-20260620-WA0308.jpg",
"IMG-20260620-WA0309.jpg"
];

const texts = [
"أجمل صورة وأجمل ذكرى ❤️",
"كل يوم معاكي أحلى من اللي قبله 🥰",
"ضحكتك أحلى حاجة في الدنيا 🌹",
"وجودك جنبي نعمة كبيرة ❤️",
"بحب كل تفصيلة فيكي 💖",
"أجمل أيام حياتي معاكي ✨",
"قلبي اختارك ومش هيختار غيرك ❤️",
"كل صورة ليها حكاية جميلة 🥰",
"انتي السعادة كلها 🌹",
"بحبك قد الدنيا وما فيها ❤️"
];

let current = 0;

function showImage(){
document.getElementById("photo").src = images[current];
document.getElementById("text").innerText = texts[current];
}

function next(){
current++;
if(current >= images.length){
current = 0;
}
showImage();
}

function prev(){
current--;
if(current < 0){
current = images.length - 1;
}
showImage();
}

setInterval(()=>{
const heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "❤️";
heart.style.left = Math.random()*100 + "vw";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},500);

</script>

</body>
</html>
