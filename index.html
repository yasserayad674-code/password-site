<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Site ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.login{
    margin-top:150px;
}

input{
    padding:12px;
    width:250px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

#content{
    display:none;
}

img{
    width:300px;
    max-width:90%;
    border-radius:20px;
    margin:10px;
}

h1{
    color:#ff4d88;
}
</style>
</head>

<body>

<div class="login" id="login">
    <h1>❤️ Welcome ❤️</h1>
    <input type="password" id="pass" placeholder="Enter Password">
    <br>
    <button onclick="checkPassword()">Login</button>
</div>

<div id="content">

<h1>❤️ My Love ❤️</h1>

<img src="IMG-20260620-WA0300.jpg">
<img src="IMG-20260620-WA0301.jpg">
<img src="IMG-20260620-WA0302.jpg">
<img src="IMG-20260620-WA0303.jpg">
<img src="IMG-20260620-WA0304.jpg">
<img src="IMG-20260620-WA0305.jpg">
<img src="IMG-20260620-WA0306.jpg">
<img src="IMG-20260620-WA0307.jpg">
<img src="IMG-20260620-WA0308.jpg">
<img src="IMG-20260620-WA0309.jpg">

<h2>
❤️ بحبك ❤️ <br>
أجمل شخص في حياتي 💕
</h2>

<audio controls autoplay loop>
    <source src="بان حببتك.mp3" type="audio/mpeg">
</audio>

</div>

<script>

const password = "love";

function checkPassword(){

    let userPass =
    document.getElementById("pass").value;

    if(userPass === password){

        document.getElementById("login").style.display="none";
        document.getElementById("content").style.display="block";

    }else{

        alert("Wrong Password ❌");

    }

}

</script>

</body>
</html>
